
stages:
- build
- test
- pages

include:
- template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
- template: Jobs/SAST.latest.gitlab-ci.yml

python_code_quality:
  stage: test
  image: aocompass/base-rockylinux9:12.9.1
  tags:
  - cq-sans-dind
  variables:
    COMPASS_ROOT: "$CI_PROJECT_DIR"
    COMPASS_INSTALL_ROOT: "$COMPASS_ROOT/local"
    SHESHA_ROOT: "$COMPASS_ROOT/shesha"
  script:
    - export PYTHONPATH=$PYTHONPATH:$SHESHA_ROOT:$COMPASS_INSTALL_ROOT/python
    - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPASS_INSTALL_ROOT/lib
    - mamba create -n compass -y "python<3.14"
    - eval "$(mamba shell hook --shell bash)"
    - mamba activate compass
    - pip install -e .

    # Install quality analysis tools
    - pip install --no-cache-dir ruff pylint

    # Run Ruff for linting and formatting checks
    - ruff check --output-format=json shesha cli > ruff-report.json || true

    # Run Pylint with GitLab-compatible JSON output
    - pylint --exit-zero --output-format=json shesha cli > pylint-report.json || true

    # Convert reports to GitLab Code Quality format
    - |
      python3 << 'EOF'
      import json
      import sys
      from pathlib import Path

      issues = []

      # Process Ruff report
      try:
          with open('ruff-report.json') as f:
              ruff_data = json.load(f)
              for issue in ruff_data:
                  issues.append({
                      "type": "issue",
                      "check_name": issue.get('code', 'unknown'),
                      "description": issue.get('message', ''),
                      "content": {"body": issue.get('message', '')},
                      "categories": ["Style"],
                      "location": {
                          "path": issue.get('filename', '').replace(str(Path.cwd()) + '/', ''),
                          "lines": {"begin": issue.get('location', {}).get('row', 1)}
                      },
                      "severity": "minor"
                  })
      except Exception as e:
          print(f"Warning: Could not process Ruff report: {e}", file=sys.stderr)

      # Process Pylint report
      try:
          with open('pylint-report.json') as f:
              pylint_data = json.load(f)
              for issue in pylint_data:
                  severity_map = {'fatal': 'blocker', 'error': 'critical', 'warning': 'major', 'refactor': 'minor', 'convention': 'info'}
                  issues.append({
                      "type": "issue",
                      "check_name": issue.get('symbol', 'unknown'),
                      "description": issue.get('message', ''),
                      "content": {"body": issue.get('message', '')},
                      "categories": ["Style"],
                      "location": {
                          "path": issue.get('path', '').replace(str(Path.cwd()) + '/', ''),
                          "lines": {"begin": issue.get('line', 1)}
                      },
                      "severity": severity_map.get(issue.get('type', 'warning'), 'minor')
                  })
      except Exception as e:
          print(f"Warning: Could not process Pylint report: {e}", file=sys.stderr)

      # Write combined report
      with open('python-code-quality-report.json', 'w') as f:
          json.dump(issues, f, indent=2)

      print(f"Generated {len(issues)} Python quality issues")
      EOF
  artifacts:
    reports:
      codequality: python-code-quality-report.json
    paths:
      - ruff-report.json
      - pylint-report.json
      - python-code-quality-report.json
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true

cpp_code_quality:
  stage: test
  image: aocompass/base-rockylinux9:12.9.1
  tags:
  - compass
  variables:
    COMPASS_ROOT: "$CI_PROJECT_DIR"
  script:
    # Generate compilation database using CMake
    - mkdir -p build_cq
    - cd build_cq
    - cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON .. || echo "CMake configuration warning - continuing"
    - cd ..

    # Run clang-tidy on C++ source files
    - |
      find libcarma libsutra -name "*.cpp" -o -name "*.hpp" | while read file; do
        clang-tidy -p build_cq "$file" 2>&1 || true
      done | tee clang-tidy-report.txt

    # Run cppcheck with XML output
    - |
      cppcheck \
        --enable=all \
        --suppress=missingIncludeSystem \
        --suppress=unusedFunction \
        --suppress=unmatchedSuppression \
        --xml \
        --xml-version=2 \
        libcarma/src.cpp libcarma/include \
        libsutra/src.cpp libsutra/include \
        2> cppcheck-report.xml || true

    # Convert cppcheck XML to GitLab Code Quality JSON format
    - |
      python3 << 'EOF'
      import xml.etree.ElementTree as ET
      import json
      from pathlib import Path

      issues = []

      # Process cppcheck report
      try:
          tree = ET.parse('cppcheck-report.xml')
          root = tree.getroot()

          for error in root.findall('.//error'):
              location = error.find('location')
              if location is not None:
                  file_path = location.get('file', '')
                  if file_path:
                      issues.append({
                          "type": "issue",
                          "check_name": error.get('id', 'unknown'),
                          "description": error.get('msg', ''),
                          "content": {"body": error.get('msg', '')},
                          "categories": ["Code Quality"],
                          "location": {
                              "path": file_path.replace(str(Path.cwd()) + '/', ''),
                              "lines": {"begin": int(location.get('line', 1))}
                          },
                          "severity": "major" if error.get('severity') in ['error', 'critical'] else "minor"
                      })
      except Exception as e:
          print(f"Warning: Could not process cppcheck report: {e}")

      # Write combined report
      with open('cpp-code-quality-report.json', 'w') as f:
          json.dump(issues, f, indent=2)

      print(f"Generated {len(issues)} C++ quality issues")
      EOF
  artifacts:
    reports:
      codequality: cpp-code-quality-report.json
    paths:
      - clang-tidy-report.txt
      - cppcheck-report.xml
      - cpp-code-quality-report.json
    expire_in: 6 mos
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true

semgrep-sast:
  services: []            # Disable Docker-in-Docker
  tags:
  - cq-sans-dind     # Set this job to only run on our new specialized runner
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Run code quality job in merge request pipelines
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH      # Run code quality job in pipelines on the default branch (but not in other branch pipelines)
    - if: $CI_COMMIT_TAG                               # Run code quality job in pipelines for tags

.build_generic:
  stage: build
  tags:
  - compass
  variables:
    COMPASS_ROOT: "$CI_PROJECT_DIR"
    SHESHA_ROOT: "$COMPASS_ROOT/shesha"
    COMPASS_INSTALL_ROOT: "$COMPASS_ROOT/local"
    COMPASS_DO_HALF: "OFF"

  script:
  - mamba create -n compass -y "python<3.14"
  - eval "$(mamba shell hook --shell bash)"
  - mamba activate compass
  - pip install -e .
  - compass build
