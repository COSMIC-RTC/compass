.test_generic:
  tags:
  - compass
  variables:
    COMPASS_ROOT: "$CI_PROJECT_DIR"
    COMPASS_INSTALL_ROOT: "$COMPASS_ROOT/local"
    SHESHA_ROOT: "$COMPASS_ROOT/shesha"
  script:
  - export PYTHONPATH=$PYTHONPATH:$SHESHA_ROOT:$COMPASS_INSTALL_ROOT/python
  - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPASS_INSTALL_ROOT/lib
  - mamba create -n compass -y "python<3.14"
  - eval "$(mamba shell hook --shell bash)"
  - mamba activate compass
  - pip install -e .
  - $COMPASS_ROOT/doc/generate_coverage.sh
  - coverage report
  coverage: '/^TOTAL.*\s+(\d+\%)$/'
  artifacts:
    name: "${CI_PROJECT_NAME}_coverage"
    paths:
    - .coverage
    - report.xml
    - report_E2E.md
    reports:
      junit: report.xml
    expire_in: 6 mos

