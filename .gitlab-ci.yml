  - pip install -e .
  - $COMPASS_ROOT/doc/py_filter_install.sh
  - $COMPASS_ROOT/doc/generate_stubs.sh
  - $COMPASS_ROOT/doc/generate_reports.sh
  - $COMPASS_ROOT/doc/correctDoxygen_gitlab.sh
  artifacts:
    paths:
    - public
  when: always  # manual / always
  only:
  - develop
