
stages:
- build
- test
- pages

sast:
  stage: test
include:
- template: Jobs/Dependency-Scanning.latest.gitlab-ci.yml
- template: Jobs/SAST.latest.gitlab-ci.yml
- template: Jobs/Code-Quality.gitlab-ci.yml

code_quality:
  image: docker:27
  services: []            # Disable Docker-in-Docker service
  tags:
  - cq-sans-dind     # Set this job to only run on our new specialized runner
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_API_VERSION: "1.45"
  script:
    - docker pull codeclimate/codeclimate:latest
    - export VOL_NAME="code_quality_vol_${CI_JOB_ID}"
    - docker volume create "$VOL_NAME"
    - |
      # Populate the volume with source code
      docker create --name "helper_${CI_JOB_ID}" -v "$VOL_NAME":/code docker:27 /bin/true
      tar -cf - . | docker cp - "helper_${CI_JOB_ID}":/code
      docker rm "helper_${CI_JOB_ID}"
      
      # Get the physical path of the volume on the host
      HOST_VOL_PATH=$(docker volume inspect --format '{{ .Mountpoint }}' "$VOL_NAME")
      
      # Run Code Climate with --no-docker to avoid spawning sibling containers.
      # This avoids the issue where temp config files cannot be mounted across DooD boundaries.
      docker run --rm \
        --env DOCKER_API_VERSION="$DOCKER_API_VERSION" \
        --volume "$HOST_VOL_PATH":/code \
        codeclimate/codeclimate:latest \
        analyze --no-docker -f json > gl-code-quality-report.json || EXIT_CODE=$?
      
      docker volume rm "$VOL_NAME"
      exit ${EXIT_CODE:-0}
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Run code quality job in merge request pipelines
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH      # Run code quality job in pipelines on the default branch (but not in other branch pipelines)
    - if: $CI_COMMIT_TAG                               # Run code quality job in pipelines for tags
  allow_failure: true      # Allow job to fail without blocking pipeline

semgrep-sast:
  services: []            # Disable Docker-in-Docker
  tags:
  - cq-sans-dind     # Set this job to only run on our new specialized runner
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Run code quality job in merge request pipelines
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH      # Run code quality job in pipelines on the default branch (but not in other branch pipelines)
    - if: $CI_COMMIT_TAG                               # Run code quality job in pipelines for tags

.build_generic:
  stage: build
  tags:
  - compass
  variables:
    COMPASS_ROOT: "$CI_PROJECT_DIR"
    SHESHA_ROOT: "$COMPASS_ROOT/shesha"
    COMPASS_INSTALL_ROOT: "$COMPASS_ROOT/local"
    COMPASS_DO_HALF: "OFF"

  script:
  - export MAMBA_ROOT_PREFIX=$CONDA_ROOT
  - mamba create -n compass -y "python<3.14"
  - eval "$(mamba shell hook --shell bash)"
  - mamba activate compass
  - pip install -e .
  - compass build
  # - export PATH=$PATH:/usr/local/cuda/bin/
  # - export VCPKG_ROOT="$HOME/vcpkg"
  # - export PYTHONPATH=$PYTHONPATH:$SHESHA_ROOT:$COMPASS_ROOT/local/python
  # - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPASS_ROOT/local/lib
  # - unset CUDA_SM
  # - . $CONDA_ROOT/etc/profile.d/conda.sh
  # - . $CONDA_ROOT/etc/profile.d/mamba.sh
  # - mamba env create --file environment.yml
  # - mamba activate compass
  # - ./script/install_vcpkg.sh
  # - ./compile.py
  artifacts:
    name: "${CI_JOB_NAME}_binaires"
    paths:
    - local/
    expire_in: 6 mos

.lint_generic:
  stage: test
  tags:
  - compass
  variables:
    COMPASS_ROOT: "$CI_PROJECT_DIR"
    COMPASS_INSTALL_ROOT: "$COMPASS_ROOT/local"
    SHESHA_ROOT: "$COMPASS_ROOT/shesha"
    COMPASS_DO_HALF: "OFF"
  script:
  - export MAMBA_ROOT_PREFIX=$CONDA_ROOT
  - export PYTHONPATH=$PYTHONPATH:$SHESHA_ROOT:$COMPASS_INSTALL_ROOT/python
  - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPASS_INSTALL_ROOT/lib
  - mamba create -n compass -y "python<3.14"
  - eval "$(mamba shell hook --shell bash)"
  - mamba activate compass
  - pip install -e .
  - ruff check shesha > ruff-report.json
  artifacts:
    name: "${CI_PROJECT_NAME}_lint"
    when: always
    reports:
      codequality: ruff-report.json
    expire_in: 6 mos

.test_generic:
  tags:
  - compass
  variables:
    COMPASS_ROOT: "$CI_PROJECT_DIR"
    COMPASS_INSTALL_ROOT: "$COMPASS_ROOT/local"
    SHESHA_ROOT: "$COMPASS_ROOT/shesha"
  script:
  - export MAMBA_ROOT_PREFIX=$CONDA_ROOT
  - export PYTHONPATH=$PYTHONPATH:$SHESHA_ROOT:$COMPASS_INSTALL_ROOT/python
  - export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$COMPASS_INSTALL_ROOT/lib
  - mamba create -n compass -y "python<3.14"
  - eval "$(mamba shell hook --shell bash)"
  - mamba activate compass
  - pip install -e .
  - $COMPASS_ROOT/shesha/tests/checkCompass.sh 
  - $COMPASS_ROOT/doc/generate_coverage.sh
  - coverage report
  coverage: '/^TOTAL.*\s+(\d+\%)$/'
  artifacts:
    name: "${CI_PROJECT_NAME}_coverage"
    paths:
    - .coverage
    - report.xml
    - report_E2E.md
    reports:
      junit: report.xml
    expire_in: 6 mos

