[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-cli"
version = "6.2.0"
description = "COMPASS CLI - Deployment and management framework for COMPASS AO systems"
readme = "cli/README.md"
requires-python = ">=3.8"
license = {text = "LGPL-3.0-or-later"}
authors = [
    {name = "Florian Ferreira", email = "florian.ferreira@obspm.fr"},
    {name = "Damien Gratadour", email = "damien.gratadour@obspm.fr"},
    {name = "Arnaud Sevin", email = "arnaud.sevin@obspm.fr"},
]
maintainers = [
    {name = "Florian Ferreira", email = "florian.ferreira@obspm.fr"},
    {name = "Arnaud Sevin", email = "arnaud.sevin@obspm.fr"},
]
keywords = ["astronomy", "adaptive-optics", "simulation", "deployment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "astropy",
    "docopt",
    "h5py",
    "ipython",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "tables",
    "tabulate",
    "aenum",
    "cmake",
    "pybind11",
    "coverage",
    "pytest-cov",
    "pytest-cover",
    "pytest-coverage",
    "pytest-html",
    "pytest-metadata",
    "ruff",
    "PyQt6<6.10",
    "pyqtgraph",
    "qtconsole",
    "pyzmq",
    "ipykernel",
    "doxypypy",
    "sphinx",
    "sphinx-rtd-theme",
    "pybind11-stubgen",
    "breathe",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
compass = "compass.cli:main"
compass-build = "compass.deployment.build:main"

[project.urls]
Homepage = "https://github.com/COSMIC-RTC/compass"
Documentation = "https://compass.pages.obspm.fr/website/"
Repository = "https://github.com/COSMIC-RTC/compass"

[tool.setuptools.packages.find]
where = ["cli"]
include = ["compass*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100

# Enable Pyflakes `E` and `F` codes by default.
lint.select = ["E", "F"]

# ignore E501 Line too long
lint.ignore = ["E501"]

# Assume Python 3.11.
target-version = "py311"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"  # Accepts: "google", "numpy", or "pep257".

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312", "py313"]

